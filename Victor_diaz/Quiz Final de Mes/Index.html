<!DOCTYPE html>
<html lang="es-Es">
<head>
	<meta charset="utf-8">
	<title>Card Flash</title>
	<link rel="stylesheet" type="text/css" href="Estilos.css">
</head>
<body>

	<div class="borde">
		<div class="card">

			<div class="imagen">
				<h2 class="velocidad">💨 Velocidad</h2>
			</div>

			<div class="contenido">
				<h3>Héroe</h3>
				<h1>Flash</h1>
				<p>El hombre más rápido del mundo, capaz de correr más rápido que la luz.</p>

				<div class="poder">
					<span class="emoji">⚡</span>
					<h4>Poder especial</h4>
					<span class="detalle">Súper velocidad</span>
				</div>

				<button class="boton">Activar poder</button>
			</div>

		</div>
	</div>

</body>
</html>
